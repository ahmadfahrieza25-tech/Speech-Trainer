<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Trainer</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-soft: #eef2ff;
      --bg-main: #f5f6fa;
      --sidebar-bg: #ffffff;
      --card-bg: #ffffff;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR KIRI */
    .sidebar {
      width: 240px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 24px 14px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px 22px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .brand-title { font-weight: 700; font-size: 17px; color: var(--text-dark); }
    .menu-heading {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #9ca3af;
      padding: 0 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all 0.15s ease;
    }
    .nav-item:hover { background: #f9fafb; color: var(--text-dark); }
    .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

    /* KONTEN UTAMA */
    .content { flex: 1; padding: 28px 36px; overflow-y: auto; max-width: 1100px; }
    .page-section { display: none; }
    .page-section.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    h1.page-title { font-size: 24px; margin: 0 0 6px 0; color: var(--text-dark); }
    p.page-subtitle { margin: 0 0 22px 0; color: var(--text-muted); font-size: 14px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .card-title { font-size: 16px; font-weight: 700; margin: 0 0 16px 0; color: var(--text-dark); }

    /* BANNER DASHBOARD */
    .hero-banner {
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      color: white;
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 26px;
    }
    .hero-banner h2 { margin: 0 0 8px 0; font-size: 24px; }
    .hero-banner p { margin: 0 0 20px 0; font-size: 14px; opacity: 0.92; max-width: 600px; line-height: 1.5; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-white {
      background: #ffffff; color: var(--primary); border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.18); color: #ffffff; border: 1px solid rgba(255,255,255,0.45);
      padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
    }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 24px; }
    .stat-box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stat-box .label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .stat-box .value { font-size: 28px; font-weight: 700; color: var(--text-dark); }

    /* FORM & INPUTS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; padding: 11px 13px; border: 1px solid #d1d5db; border-radius: 9px;
      font-size: 14px; font-family: inherit; background: #fff; color: var(--text-dark);
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .btn-primary {
      background: var(--primary); color: #fff; border: none; padding: 11px 20px; border-radius: 9px;
      font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }

    .btn-success {
      background: var(--success); color: #fff; border: none; padding: 11px 20px; border-radius: 9px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-danger-sm {
      background: #fee2e2; color: #b91c1c; border: none; padding: 6px 12px; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }

    .mode-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .tab-pill {
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); background: #f9fafb; color: var(--text-muted);
    }
    .tab-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .saved-item {
      border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #fafafa;
    }
    .saved-item-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .saved-item-meta { font-size: 12px; color: var(--text-muted); }

    /* AREA LATIHAN */
    .script-viewer {
      background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 18px;
      font-size: 15px; line-height: 1.7; white-space: pre-wrap; max-height: 240px; overflow-y: auto; margin-bottom: 18px;
    }
    .recorder-box {
      text-align: center; padding: 24px; border: 1px solid var(--border); border-radius: 12px;
      background: #fcfcfd; margin-bottom: 20px;
    }
    .timer-display { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text-dark); margin-bottom: 4px; }
    .rec-status { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .rec-status.recording { color: var(--danger); font-weight: 600; }
    .rec-status.ready { color: var(--success); font-weight: 600; }
    .alert-warning { background: #fef3c7; color: #92400e; padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }

    /* EVALUASI & RIWAYAT */
    .score-circle {
      width: 100px; height: 100px; border-radius: 50%; background: var(--primary-soft); color: var(--primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; font-size: 30px; border: 4px solid var(--primary);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; background: #f9fafb; }

    .hidden { display: none !important; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
      .brand, .menu-heading { display: none; }
      .grid-2, .stats-row { grid-template-columns: 1fr; }
      .content { padding: 18px 16px; }
    }
  </style>
</head>

      <div class="brand-icon">🎙️</div>
      <div class="brand-title">Speech Trainer</div>
